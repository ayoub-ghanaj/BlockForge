[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Executable scripts add the checkout to sys.path before importing the add-on.
"tools/*.py" = ["E402"]
"tests/blender_*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
